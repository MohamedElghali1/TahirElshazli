# nginx reverse proxy for the Hostinger VPS (docs/HOSTINGER_DEPLOYMENT.md §5.2, REM-021).
#
# Install at /etc/nginx/sites-available/tahirelshazli, symlink into
# sites-enabled, `nginx -t && systemctl reload nginx`. Terminates TLS with a
# Cloudflare Origin Certificate (Full strict mode) and proxies to the two
# containers, which bind to 127.0.0.1 only (docker-compose.prod.yml).
#
# real_ip is deliberately NOT configured here. TRUSTED_PROXY_HOPS=2
# (backend/src/common/config/env.ts resolveTrustedProxyHops) makes the app
# itself walk two entries back through X-Forwarded-For to find the real
# client - Cloudflare's hop, then nginx's `proxy_add_x_forwarded_for` hop
# below. Adding ngx_http_realip_module here would have nginx rewrite
# X-Forwarded-For itself before the app ever sees it, which is exactly the
# "what the app sees" this comment is about - two mechanisms deciding the same
# thing drift. Left out on purpose; if a monitoring tool later needs the
# client IP in nginx's own access log, add `real_ip` for logging only and
# re-check it does not alter the header the proxy passes upstream.

server {
    listen 80;
    listen [::]:80;
    server_name tahirelshazli.com www.tahirelshazli.com api.tahirelshazli.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tahirelshazli.com www.tahirelshazli.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    # The web app itself accepts no uploads - submissions and media go
    # straight to the api. host.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.tahirelshazli.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    # The real ceiling, found by grep rather than guessed: the largest multer
    # `limits.fileSize` in backend/src is MAX_UPLOAD_BYTES = 64 MB
    # (backend/src/common/storage/upload-types.ts, the blog/general upload
    # endpoint). Everything else is smaller - a student assessment submission
    # caps at STUDENT_UPLOAD_MAX_BYTES = 20 MB
    # (backend/src/assessments/assessments.service.ts), a CSV import at
    # CSV_MAX_BYTES = 2 MB (backend/src/assessments/google-form-csv.ts), an
    # avatar at AVATAR_MAX_UPLOAD_BYTES = 5 MB
    # (backend/src/common/storage/upload-types.ts). 70m leaves multipart
    # encoding overhead above the 64 MB body nginx actually has to pass
    # through; Cloudflare's own request-body cap (100 MB on Free/Pro) is
    # higher still and is not the limiting factor here.
    client_max_body_size 70m;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
