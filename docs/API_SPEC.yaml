openapi: 3.1.0

# =============================================================================
# Dr. Tahir LMS — API contract for the redesign.
#
# SCOPE OF THIS FILE
#   It specifies every route the redesign ADDS or CHANGES, plus the shared
#   model (errors, security, pagination, common schemas) that all routes obey.
#   The ~57 routes classified [KEEP] in API_GAP_ANALYSIS.md are already
#   specified by their NestJS DTOs and are not restated here; duplicating them
#   would create a second source of truth that drifts.
#
# CONVENTIONS THAT ARE NOT NEGOTIABLE
#   1. No global prefix. `setGlobalPrefix` is never called; paths are literal.
#   2. Error envelope is Nest's default {statusCode, message, error}. Tests
#      compare `message` byte-for-byte to prove an out-of-scope 404 is
#      indistinguishable from a genuinely-missing 404. A custom envelope would
#      break that oracle for no gain.
#   3. Out-of-scope resources answer 404, never 403. 403 is reserved for
#      "you are the wrong ROLE for this action", which leaks nothing.
#   4. The acting user is always the JWT subject. No route accepts a student id
#      that names someone other than the caller.
#   5. Scope lives in the path (/staff/groups/{groupId}/...), never in a query
#      parameter — it makes the authorization object obvious at the route level.
#   6. Timestamps are ISO 8601 UTC. Money, if it ever appears, is minor units.
# =============================================================================

info:
  title: Dr. Tahir LMS API
  version: 2.0.0-redesign
  description: >
    Backend for tahirelshazli.com. This version reconciles the existing API with
    the Claude Design product redesign. See docs/API_GAP_ANALYSIS.md for the
    route-by-route disposition and docs/AUTHORIZATION_MODEL.md for the rules
    every `x-roles` annotation below is shorthand for.

servers:
  - url: http://localhost:3001
    description: Local development
  - url: https://api.tahirelshazli.com
    description: Production

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: students-admin
  - name: assistants-admin
  - name: groups
  - name: tasks
  - name: marking
  - name: markbook
  - name: sessions
  - name: reports
  - name: announcements
  - name: settings
  - name: student

# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation failed. `message` is an array of constraint strings.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, expired, revoked or tampered token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: >
        Authenticated but the wrong ROLE for this action. Never used for
        out-of-scope resources — those are 404.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: >
        The resource does not exist, OR exists outside the caller's scope. The
        body is identical in both cases, deliberately.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The action contradicts current state (e.g. already sent).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After: { schema: { type: integer } }
        X-RateLimit-Limit: { schema: { type: integer } }
        X-RateLimit-Remaining: { schema: { type: integer } }
        X-RateLimit-Reset: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: A required driver is not configured (mail, storage, Google).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  parameters:
    Limit:
      { name: limit, in: query, required: false,
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    Offset:
      { name: offset, in: query, required: false,
        schema: { type: integer, minimum: 0, default: 0 } }
    Cursor:
      { name: cursor, in: query, required: false, schema: { type: string, maxLength: 200 },
        description: Opaque keyset cursor. Never an offset for append-only feeds. }

  schemas:

    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode: { type: integer }
        message:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        error: { type: string }

    Id:
      type: string
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'

    Role:
      type: string
      enum: [visitor, student, parent, assistant, teacher, admin]

    UserStatus:
      type: string
      enum: [waiting, active, rejected]

    AssistantScope:
      type: string
      enum: [all_groups, assigned_groups]

    # StudyMode is REMOVED. `CHANGELOG.md` `D-4`, ruling R-2 (2026-09-20):
    # `students.mode` is not built, so the enum had no producer and no consumer
    # and `mode` was `required` on two schemas nothing could satisfy. Removing
    # it is the same reconciliation unit 1 did for `Assistant`.
    SessionMode:  { type: string, enum: [on_ground, online] }
    AttendanceStatus: { type: string, enum: [present, absent, late] }
    # `D-28`: two STORED values. `scheduled` is not stored and never accepted -
    # see `VisibilityState`.
    TaskVisibility:   { type: string, enum: [published, hidden] }
    # What a staff screen shows: `scheduled` is DERIVED on the server for a
    # `published` task before the EARLIEST effective `availableFrom` across its
    # targeted groups, counting per-group overrides (`D-37`).
    VisibilityState:  { type: string, enum: [published, scheduled, hidden] }
    # The staff-side status of a task (`D-30`, `D-34`, `D-35`), derived - see
    # `GET /staff/tasks`.
    StaffTaskStatus:  { type: string, enum: [open, marking, marked, closed] }
    # How a student may hand the work in (`D-31`). Multi-file is unit 7's.
    SubmissionMode:   { type: string, enum: [pdf_upload, doc_link, photo_upload] }
    WorkType:         { type: string, enum: [file_upload, link, google_form] }
    AssessmentType:   { type: string, enum: [homework, assignment, quiz] }
    ReportStatus:     { type: string, enum: [new, under_review, reviewed, sent] }
    # `D-2`: pins (comment, tick, cross) and freehand strokes (pen, highlight).
    # The eraser is not a kind - erasing is DELETE (A-10).
    AnnotationKind:   { type: string, enum: [comment, tick, cross, pen, highlight] }
    # Where one student stands on one task (unit 7), derived on every read:
    # no submission / submitted, no mark / mark saved / mark returned.
    SubmissionStatus: { type: string, enum: [not_submitted, submitted, marked, returned] }

    # --- People ------------------------------------------------------------
    # The TARGET shape, filled in by `PEOPLE-1` (unit 5). What the server emits
    # today is `StudentDirectoryEntry` below - the percentages have no source
    # until the reports and analytics units.
    StudentSummary:
      type: object
      required: [id, name, email, status]
      properties:
        id:        { $ref: '#/components/schemas/Id' }
        name:      { type: string }
        email:     { type: string, format: email }
        status:    { $ref: '#/components/schemas/UserStatus' }
        schoolName: { type: [string, 'null'] }
        groupId:   { type: [string, 'null'] }
        groupName: { type: [string, 'null'] }
        joinedAt:  { type: string, format: date-time }
        # Progress and performance are SEPARATE fields and must never be
        # averaged into one figure (non-negotiable 02).
        attendancePercent: { type: [number, 'null'] }
        quizAveragePercent: { type: [number, 'null'] }
        taskAveragePercent: { type: [number, 'null'] }
        progressPercent:    { type: [number, 'null'] }

    StudentDetail:
      allOf:
        - $ref: '#/components/schemas/StudentSummary'
        - type: object
          properties:
            phone:       { type: [string, 'null'] }
            avatarUrl:   { type: [string, 'null'] }
            parentEmail: { type: [string, 'null'], format: email }
            staffNotes:  { type: [string, 'null'] }

    StudentWrite:
      type: object
      required: [name, email]
      properties:
        name:        { type: string, minLength: 2, maxLength: 100 }
        email:       { type: string, format: email }
        schoolName:  { type: [string, 'null'], maxLength: 160 }
        parentEmail: { type: [string, 'null'], format: email }
        staffNotes:  { type: [string, 'null'], maxLength: 4000 }
        groupId:     { type: [string, 'null'] }
        avatarUrl:   { type: [string, 'null'], maxLength: 2048 }

    # **What `GET /admin/students` and `POST .../accept` return today**
    # (`manage/directory.service.ts` `StudentDirectoryEntry`, `DOM-4`).
    #
    # A narrower shape than `StudentSummary` on purpose: `groupId`, `groupName`
    # and the four percentages have no source in the repository until the
    # reports and analytics units, and emitting a shape the server cannot fill
    # is the drift `CLAUDE.md` §6 names. `PEOPLE-1` widens this to
    # `StudentSummary`.
    StudentDirectoryEntry:
      type: object
      required: [id, name, email, createdAt, enrolledCourseCount, status]
      properties:
        id:        { $ref: '#/components/schemas/Id' }
        name:      { type: string }
        email:     { type: string, format: email }
        createdAt: { type: string, format: date-time }
        enrolledCourseCount: { type: integer, minimum: 0 }
        status:    { $ref: '#/components/schemas/UserStatus' }

    # --- Courses, as an admin writes them (`DOM-5`) -------------------------
    Course:
      type: object
      required:
        [id, slug, isPublished, title, description, teacherName,
         sequentialLockEnabled, modules]
      properties:
        id:          { $ref: '#/components/schemas/Id' }
        slug:        { type: string, pattern: '^[a-z0-9-]+$', maxLength: 120 }
        isPublished: { type: boolean }
        title:       { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        thumbnailUrl: { type: [string, 'null'], maxLength: 2048 }
        teacherName: { type: string, maxLength: 160 }
        sequentialLockEnabled: { type: boolean }
        modules:     { type: array, items: { type: object } }

    CourseWrite:
      type: object
      required: [title, description, slug, teacherName]
      properties:
        title:       { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        slug:        { type: string, pattern: '^[a-z0-9-]+$', maxLength: 120 }
        teacherName: { type: string, minLength: 1, maxLength: 160 }
        thumbnailUrl: { type: [string, 'null'], maxLength: 2048 }
        sequentialLockEnabled: { type: boolean }
        # Absent means DRAFT. A course that published itself on creation would
        # put an empty outline on the public site.
        isPublished: { type: boolean }

    # Every field optional. `thumbnailUrl` is the only one where `null` is a
    # value ("clear it") rather than a 400 - the rest are NOT NULL columns.
    CoursePatch:
      type: object
      properties:
        title:       { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        slug:        { type: string, pattern: '^[a-z0-9-]+$', maxLength: 120 }
        teacherName: { type: string, minLength: 1, maxLength: 160 }
        thumbnailUrl: { type: [string, 'null'], maxLength: 2048 }
        sequentialLockEnabled: { type: boolean }
        isPublished: { type: boolean }

    Assistant:
      type: object
      # Built and populated by `PEOPLE-4`/`PEOPLE-6`/`AUTH-4` (unit 5,
      # `AdminAssistantsService`). One shape for a real account and a
      # still-pending invitation - the two backing tables differ, the
      # response does not.
      required: [id, name, email, role, createdAt, scope, groupIds, status, lastSeenAt]
      properties:
        id:     { $ref: '#/components/schemas/Id' }
        name:   { type: string }
        email:  { type: string, format: email }
        role:   { type: string, enum: [assistant, admin] }
        createdAt: { type: string, format: date-time }
        # Always `all_groups` for an active `admin` - admins are unscoped by
        # role and hold no scope row. For an active `assistant` with no scope
        # row ("never configured"), `assigned_groups` with no groups: it
        # reaches nothing.
        scope:  { $ref: '#/components/schemas/AssistantScope' }
        groupIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
        status: { type: string, enum: [invited, active] }
        # Derived from the audit log, not stored (D-9 / PEOPLE-6): MAX(created_at)
        # for that actor. It is *last acted*, not *last seen* - an assistant who
        # signs in and only reads shows null. Label it accordingly.
        lastSeenAt: { type: [string, 'null'], format: date-time }

    AssistantWrite:
      type: object
      required: [name, email, role, scope]
      properties:
        name:  { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email }
        role:  { type: string, enum: [assistant, admin] }
        scope: { $ref: '#/components/schemas/AssistantScope' }
        groupIds:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Id' }
          description: >
            Required and non-empty when scope is assigned_groups; must be empty
            when scope is all_groups or role is admin.

    # --- Groups ------------------------------------------------------------
    # The one group response shape, and every group response is it - the list,
    # the single read, and both writes. `memberCount` is required and therefore
    # emitted by all four; `POST` answers 0 without a query (review F2A-4).
    Group:
      type: object
      required: [id, name, courseId, memberCount]
      properties:
        id:           { $ref: '#/components/schemas/Id' }
        name:         { type: string }
        courseId:     { $ref: '#/components/schemas/Id' }
        courseTitle:  { type: string }
        # DISPLAY ONLY. Who runs this group. It is NEVER an authorization
        # input: what an assistant may reach is decided from
        # `assistant_group_assignments` + `assistant_scopes`, and the two are
        # allowed to disagree.
        assistantId:  { type: [string, 'null'] }
        assistantName: { type: [string, 'null'] }
        meets:        { type: [string, 'null'], maxLength: 120 }
        room:         { type: [string, 'null'], maxLength: 80 }
        memberCount:  { type: integer }

    # POST body. `name` and `courseId` are both required: a group IS a cohort
    # studying one named course (migration 013), so neither half can be left out
    # and have the row still mean anything. `assistantId` is DISPLAY ONLY and
    # grants nothing - see `Group.assistantId`.
    GroupWrite:
      type: object
      required: [name, courseId]
      properties:
        name:         { type: string, minLength: 1, maxLength: 120 }
        courseId:     { $ref: '#/components/schemas/Id' }
        assistantId:  { type: [string, 'null'] }
        meets:        { type: [string, 'null'], maxLength: 120 }
        room:         { type: [string, 'null'], maxLength: 80 }

    # PATCH body. Every field optional; an explicit null clears a nullable one,
    # and an omitted field is left alone.
    GroupPatch:
      type: object
      minProperties: 1
      properties:
        name:         { type: string, minLength: 1, maxLength: 120 }
        courseId:     { $ref: '#/components/schemas/Id' }
        assistantId:  { type: [string, 'null'] }
        meets:        { type: [string, 'null'], maxLength: 120 }
        room:         { type: [string, 'null'], maxLength: 80 }

    # `GET /staff/groups/{groupId}/report` (`GROUP-4`). Performance only - no
    # progress/completion figure sits beside it (CLAUDE.md §11.1).
    GroupReportEntry:
      type: object
      required: [studentId, name, email, submittedCount, gradedCount, averageScorePercent]
      properties:
        studentId: { $ref: '#/components/schemas/Id' }
        name:      { type: string }
        email:     { type: string, format: email }
        submittedCount: { type: integer }
        gradedCount:    { type: integer }
        averageScorePercent: { type: [integer, 'null'] }

    GroupReport:
      type: object
      required: [groupId, groupName, courseId, courseTitle, memberCount, assessmentCount, averageScorePercent, entries]
      properties:
        groupId:     { $ref: '#/components/schemas/Id' }
        groupName:   { type: string }
        courseId:    { $ref: '#/components/schemas/Id' }
        courseTitle: { type: string }
        memberCount: { type: integer }
        # Assessments actually targeted at this group, not every assessment
        # on the course.
        assessmentCount: { type: integer }
        # Every graded submission's own share, averaged once across the whole
        # group - not an average of the per-student averages.
        averageScorePercent: { type: [integer, 'null'] }
        entries:
          type: array
          items: { $ref: '#/components/schemas/GroupReportEntry' }

    # --- Tasks -------------------------------------------------------------
    # A draft-library template (`TASK-2`) - the RESPONSE shape. Content only:
    # no window, audience or submission settings. `usedCount`, `createdBy` and
    # the timestamps are server-owned; the request bodies are `TaskDraftWrite`
    # and `TaskDraftUpdate` below (unit 6 corrected this schema being used as a
    # request body, which required `id` and `usedCount` from the client).
    TaskDraft:
      type: object
      required: [id, courseId, type, workType, title, description, instructions, attachments, usedCount, createdBy, createdAt, updatedAt]
      properties:
        id:        { $ref: '#/components/schemas/Id' }
        courseId:  { $ref: '#/components/schemas/Id' }
        type:      { $ref: '#/components/schemas/AssessmentType' }
        workType:  { $ref: '#/components/schemas/WorkType' }
        title:     { type: string }
        description:  { type: string }
        instructions: { type: string }
        attachments:  { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        # How many tasks were authored from this draft. A global fact about the
        # draft, not a number that depends on who is looking.
        usedCount: { type: integer, minimum: 0 }
        createdBy: { $ref: '#/components/schemas/Id' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # `POST /staff/task-drafts`. Undeclared fields are stripped, never honoured.
    TaskDraftWrite:
      type: object
      required: [courseId, type, title]
      properties:
        courseId:     { $ref: '#/components/schemas/Id' }
        type:         { $ref: '#/components/schemas/AssessmentType' }
        workType:     { $ref: '#/components/schemas/WorkType' }
        # Must contain a non-space character.
        title:        { type: string, minLength: 1, maxLength: 200 }
        description:  { type: string, maxLength: 1000 }
        instructions: { type: string, maxLength: 5000 }
        attachments:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Attachment' }

    # `PATCH /staff/task-drafts/{draftId}`. Every field optional and NEVER null
    # (`D-11`: each is a NOT NULL column). `courseId` is fixed after creation.
    TaskDraftUpdate:
      type: object
      properties:
        type:         { $ref: '#/components/schemas/AssessmentType' }
        workType:     { $ref: '#/components/schemas/WorkType' }
        title:        { type: string, minLength: 1, maxLength: 200 }
        description:  { type: string, maxLength: 1000 }
        instructions: { type: string, maxLength: 5000 }
        attachments:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Attachment' }

    # A file or link on a task or a draft (`TASK-4`). `url` is an uploaded
    # `/uploads/<name>` path or a public http(s) URL - `javascript:` and `data:`
    # are refused (`IsMediaUrl`), and the URL is never fetched server-side.
    # `mimeType` and `sizeBytes` are display-only.
    # `audience` (`D-29`) is REQUIRED with no default: a mark scheme defaulted to
    # `students` is the mistake it exists to prevent. The student read returns
    # only `students` attachments. It governs what the API returns, not access
    # to the file - `/uploads/*` is unauthenticated until signed URLs on R2.
    Attachment:
      type: object
      required: [url, name, audience]
      properties:
        url:       { type: string, maxLength: 2048 }
        name:      { type: string, minLength: 1, maxLength: 200 }
        mimeType:  { type: [string, 'null'], maxLength: 120 }
        sizeBytes: { type: [integer, 'null'], minimum: 0 }
        audience:  { type: string, enum: [students, staff] }

    # --- Authoring (`/staff/courses/{courseId}/assessments`, `/staff/assessments/*`)
    # Added in unit 6: these routes were `[MODIFY]` in `API_GAP_ANALYSIS.md`
    # with no entry here at all.
    AssessmentTarget:
      type: object
      required: [id, assessmentId, groupId, availableFrom, availableTo, dueAt]
      properties:
        id:            { $ref: '#/components/schemas/Id' }
        assessmentId:  { $ref: '#/components/schemas/Id' }
        groupId:       { $ref: '#/components/schemas/Id' }
        # OVERRIDES of the task's own window. Null means inherit.
        availableFrom: { type: [string, 'null'], format: date-time }
        availableTo:   { type: [string, 'null'], format: date-time }
        dueAt:         { type: [string, 'null'], format: date-time }

    AssessmentTargetInput:
      type: object
      required: [groupId]
      properties:
        groupId:       { $ref: '#/components/schemas/Id' }
        availableFrom: { type: string, format: date-time }
        availableTo:   { type: string, format: date-time }
        dueAt:         { type: string, format: date-time }

    # A task as the authoring screens see it: every stored field plus its full
    # audience. `visibility`, `markerId`, `allowResubmission`, `submissionModes`,
    # `draftId` and `attachments` are unit 6 (migration 018).
    AuthoredAssessment:
      type: object
      required: [id, courseId, lessonId, title, description, instructions, type, topics,
                 availableFrom, availableTo, dueAt, maxScore, allowedFileTypes,
                 maxFileSizeBytes, workType, externalUrl, visibility, markerId,
                 allowResubmission, submissionModes, draftId, attachments, createdAt, targets]
      properties:
        id:          { $ref: '#/components/schemas/Id' }
        courseId:    { $ref: '#/components/schemas/Id' }
        lessonId:    { type: [string, 'null'] }
        title:       { type: string }
        description: { type: string }
        instructions: { type: string }
        type:        { $ref: '#/components/schemas/AssessmentType' }
        topics:      { type: array, items: { type: string } }
        availableFrom: { type: string, format: date-time }
        availableTo:   { type: string, format: date-time }
        dueAt:         { type: string, format: date-time }
        maxScore:      { type: integer }
        allowedFileTypes: { type: array, items: { type: string } }
        maxFileSizeBytes: { type: integer }
        workType:    { $ref: '#/components/schemas/WorkType' }
        externalUrl: { type: [string, 'null'] }
        visibility:  { $ref: '#/components/schemas/TaskVisibility' }
        markerId:    { type: [string, 'null'] }
        # `true` (the default) is today's rule: resubmission until window END,
        # not `dueAt` (`D-31`). `false` makes a second submission a 409.
        allowResubmission: { type: boolean }
        submissionModes: { type: array, items: { $ref: '#/components/schemas/SubmissionMode' } }
        # Provenance only - the content was COPIED from the draft, never linked.
        # Null once the draft is deleted.
        draftId:     { type: [string, 'null'] }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        createdAt:   { type: string, format: date-time }
        targets:     { type: array, items: { $ref: '#/components/schemas/AssessmentTarget' } }

    # A target on the staff task list, with its group's display name.
    StaffTaskTarget:
      allOf:
        - { $ref: '#/components/schemas/AssessmentTarget' }
        - type: object
          required: [groupName]
          properties:
            groupName: { type: string }

    # One row of `GET /staff/tasks`: every `AuthoredAssessment` field, with
    # `targets` narrowed to the groups the caller reaches.
    StaffTask:
      allOf:
        - { $ref: '#/components/schemas/AuthoredAssessment' }
        - type: object
          required: [targets, visibilityState, status, markerName, markerDrift]
          properties:
            targets: { type: array, items: { $ref: '#/components/schemas/StaffTaskTarget' } }
            visibilityState: { $ref: '#/components/schemas/VisibilityState' }
            # `D-30`/`D-34`/`D-35`. Always one of the four.
            status: { $ref: '#/components/schemas/StaffTaskStatus' }
            markerName: { type: [string, 'null'] }
            # `D-32`: the named marker no longer qualifies for the task's WHOLE
            # audience. Displayed, never silently repaired. A fact about the
            # task, identical for every viewer. False when no marker is named.
            markerDrift: { type: boolean }

    # `POST /staff/courses/{courseId}/assessments`. The body is authoritative:
    # `draftId` records provenance and bumps the draft's `usedCount`, and the
    # server merges nothing from the draft (assumption A-2).
    AssessmentWrite:
      type: object
      required: [title, type, availableFrom, availableTo, dueAt, maxScore,
                 allowedFileTypes, maxFileSizeBytes, targets]
      properties:
        title:        { type: string, minLength: 1, maxLength: 200 }
        description:  { type: string, maxLength: 1000 }
        instructions: { type: string, maxLength: 5000 }
        type:         { $ref: '#/components/schemas/AssessmentType' }
        topics:       { type: array, maxItems: 20, items: { type: string, maxLength: 80 } }
        lessonId:     { $ref: '#/components/schemas/Id' }
        availableFrom: { type: string, format: date-time }
        availableTo:   { type: string, format: date-time }
        dueAt:         { type: string, format: date-time }
        maxScore:      { type: integer, minimum: 1, maximum: 1000 }
        allowedFileTypes: { type: array, minItems: 1, maxItems: 20, items: { type: string } }
        maxFileSizeBytes: { type: integer, minimum: 1, maximum: 104857600 }
        workType:    { $ref: '#/components/schemas/WorkType' }
        externalUrl: { type: string, maxLength: 2048 }
        googleForm:  { type: string, minLength: 8, maxLength: 512 }
        targets:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/AssessmentTargetInput' }
        draftId:     { $ref: '#/components/schemas/Id' }
        attachments:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Attachment' }
        allowResubmission: { type: boolean, default: true }
        visibility: { $ref: '#/components/schemas/TaskVisibility' }
        # `D-32`. Null/omitted is "whoever opens it first". An assistant sending a
        # non-null value is a 403. The named user must be the teacher, an admin,
        # or an ACTIVE assistant who reaches every targeted group - else 400.
        markerId: { type: [string, 'null'] }
        # `D-31`. Each at most once. Omitted is `[]` ("not stated").
        submissionModes:
          type: array
          uniqueItems: true
          maxItems: 3
          items: { $ref: '#/components/schemas/SubmissionMode' }

    # `PATCH /staff/assessments/{assessmentId}`. Every field optional and never
    # null. `type`, `courseId` and `draftId` are not patchable.
    AssessmentPatch:
      type: object
      properties:
        title:        { type: string, minLength: 1, maxLength: 200 }
        description:  { type: string, maxLength: 1000 }
        instructions: { type: string, maxLength: 5000 }
        topics:       { type: array, maxItems: 20, items: { type: string, maxLength: 80 } }
        availableFrom: { type: string, format: date-time }
        availableTo:   { type: string, format: date-time }
        dueAt:         { type: string, format: date-time }
        maxScore:      { type: integer, minimum: 1, maximum: 1000 }
        allowedFileTypes: { type: array, minItems: 1, maxItems: 20, items: { type: string } }
        maxFileSizeBytes: { type: integer, minimum: 1, maximum: 104857600 }
        workType:    { $ref: '#/components/schemas/WorkType' }
        externalUrl: { type: string, maxLength: 2048 }
        googleForm:  { type: string, minLength: 8, maxLength: 512 }
        # Replaces the whole list; `[]` clears it.
        attachments:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Attachment' }
        allowResubmission: { type: boolean }
        # `hidden` on a task with any submission is a 409 (`D-28`).
        visibility: { $ref: '#/components/schemas/TaskVisibility' }
        # `D-32`. Teacher/admin only: an assistant setting OR clearing a marker
        # is a 403. Checked against the task's current audience (400); re-aiming
        # the task later does not clear it.
        markerId: { type: [string, 'null'] }
        # `D-31`. Replaces the whole set.
        submissionModes:
          type: array
          uniqueItems: true
          maxItems: 3
          items: { $ref: '#/components/schemas/SubmissionMode' }

    # --- Marking -----------------------------------------------------------
    # `[x%, y%]` from the page box's physical top-left.
    AnnotationPoint:
      type: array
      minItems: 2
      maxItems: 2
      items: { type: number, minimum: 0, maximum: 100 }

    # A mark on one page of one file of a submission (`MARK-1`, `D-2`). Data,
    # never a flattened file. `path` is present exactly for pen/highlight.
    Annotation:
      type: object
      required: [id, submissionId, fileUrl, page, xPercent, yPercent, kind, text, path,
                 createdBy, createdByName, createdAt, updatedAt]
      properties:
        id:            { $ref: '#/components/schemas/Id' }
        submissionId:  { $ref: '#/components/schemas/Id' }
        fileUrl:       { type: string, description: Which file of the submission it was drawn on (A-11). }
        page:          { type: integer, minimum: 1, maximum: 500 }
        xPercent:      { type: number, minimum: 0, maximum: 100 }
        yPercent:      { type: number, minimum: 0, maximum: 100 }
        kind:          { $ref: '#/components/schemas/AnnotationKind' }
        text:          { type: string, minLength: 0, maxLength: 2000, description: 'Non-blank for a comment; usually empty otherwise.' }
        path:
          type: [array, 'null']
          minItems: 2
          maxItems: 2000
          items: { $ref: '#/components/schemas/AnnotationPoint' }
        createdBy:     { $ref: '#/components/schemas/Id' }
        createdByName: { type: string }
        createdAt:     { type: string, format: date-time }
        updatedAt:     { type: string, format: date-time }

    # What the student receives on a RETURNED paper: no author (field minimisation).
    StudentAnnotation:
      type: object
      required: [id, fileUrl, page, xPercent, yPercent, kind, text, path]
      properties:
        id:       { $ref: '#/components/schemas/Id' }
        fileUrl:  { type: string }
        page:     { type: integer, minimum: 1, maximum: 500 }
        xPercent: { type: number, minimum: 0, maximum: 100 }
        yPercent: { type: number, minimum: 0, maximum: 100 }
        kind:     { $ref: '#/components/schemas/AnnotationKind' }
        text:     { type: string, maxLength: 2000 }
        path:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/AnnotationPoint' }

    AnnotationWrite:
      type: object
      required: [fileUrl, page, xPercent, yPercent, kind]
      properties:
        fileUrl:  { type: string, minLength: 1, maxLength: 2048, description: 'One of the submission''s current, platform-stored files (400 otherwise).' }
        page:     { type: integer, minimum: 1, maximum: 500 }
        xPercent: { type: number, minimum: 0, maximum: 100 }
        yPercent: { type: number, minimum: 0, maximum: 100 }
        kind:     { $ref: '#/components/schemas/AnnotationKind' }
        text:     { type: string, maxLength: 2000, default: '' }
        path:
          type: array
          minItems: 2
          maxItems: 2000
          description: Required for pen/highlight, refused for a pin.
          items: { $ref: '#/components/schemas/AnnotationPoint' }

    # An edit. `kind` and `fileUrl` are not editable (delete and create instead);
    # none of these is nullable.
    AnnotationPatch:
      type: object
      properties:
        page:     { type: integer, minimum: 1, maximum: 500 }
        xPercent: { type: number, minimum: 0, maximum: 100 }
        yPercent: { type: number, minimum: 0, maximum: 100 }
        text:     { type: string, maxLength: 2000 }
        path:
          type: array
          minItems: 2
          maxItems: 2000
          items: { $ref: '#/components/schemas/AnnotationPoint' }

    # The file of a submission as the marking view renders it - server-derived.
    # Zero or one today (a submission is one `fileUrl`); a list because MARK-6
    # (B-1/B-2, open) may allow several.
    # `image`/`pdf` are platform-stored and annotatable; `file` is platform-
    # stored but not renderable; `link` is a pasted URL, graded without mark-up
    # (`D-41`).
    SubmissionDocument:
      type: object
      required: [url, kind, annotatable]
      properties:
        url:         { type: string }
        kind:        { type: string, enum: [image, pdf, file, link] }
        annotatable: { type: boolean }

    TaskSubmissionRow:
      type: object
      required: [studentId, studentName, groupId, groupName, submissionId, status, dueAt,
                 isLate, isOverdue, fileUrl, documents, answerText, lastSubmittedAt,
                 score, feedback, correctedAt, returnedAt, annotationCount, staleAnnotationCount]
      properties:
        studentId:       { $ref: '#/components/schemas/Id' }
        studentName:     { type: string, description: Name only - no email. }
        groupId:         { $ref: '#/components/schemas/Id', description: 'The earliest placement among the caller''s reachable targeted groups (A-7).' }
        groupName:       { type: string }
        submissionId:    { type: [string, 'null'] }
        status:          { $ref: '#/components/schemas/SubmissionStatus' }
        dueAt:           { type: string, format: date-time, description: 'This student''s own deadline (their resolving group''s override, or the task''s).' }
        isLate:          { type: boolean }
        isOverdue:       { type: boolean, description: No submission and past this student's deadline. }
        fileUrl:         { type: [string, 'null'] }
        documents:       { type: array, items: { $ref: '#/components/schemas/SubmissionDocument' } }
        answerText:      { type: [string, 'null'] }
        lastSubmittedAt: { type: [string, 'null'], format: date-time }
        score:           { type: [integer, 'null'] }
        feedback:        { type: [string, 'null'] }
        correctedAt:     { type: [string, 'null'], format: date-time }
        returnedAt:      { type: [string, 'null'], format: date-time }
        annotationCount:      { type: integer, description: Marks on the file the submission carries now. }
        staleAnnotationCount: { type: integer, description: 'Marks on a file a resubmission replaced (`D-42` (c)); kept.' }

    # Per reachable targeted group. Counted over that group's own members, so
    # a figure is the same for every viewer who can see the group. There is
    # deliberately no cross-group total.
    TaskSubmissionGroup:
      type: object
      required: [groupId, groupName, memberCount, notSubmitted, submitted, marked, returned]
      properties:
        groupId:      { $ref: '#/components/schemas/Id' }
        groupName:    { type: string }
        memberCount:  { type: integer }
        notSubmitted: { type: integer }
        submitted:    { type: integer }
        marked:       { type: integer }
        returned:     { type: integer }

    TaskSubmissions:
      type: object
      required: [assessmentId, courseId, title, maxScore, dueAt, workType,
                 markerId, markerName, groups, rows]
      properties:
        assessmentId:    { $ref: '#/components/schemas/Id' }
        courseId:        { $ref: '#/components/schemas/Id' }
        title:           { type: string }
        maxScore:        { type: integer }
        dueAt:           { type: string, format: date-time }
        workType:        { $ref: '#/components/schemas/WorkType' }
        markerId:        { type: [string, 'null'], description: '`D-43`: advisory; set by the first saved mark when unclaimed.' }
        markerName:      { type: [string, 'null'] }
        groups:          { type: array, items: { $ref: '#/components/schemas/TaskSubmissionGroup' } }
        rows:            { type: array, items: { $ref: '#/components/schemas/TaskSubmissionRow' } }

    # One grading row: the course queue's item, and what `/grade` and `/return`
    # answer (unit 7). `status` is `awaiting | graded` - a saved mark is graded;
    # `returnedAt` says whether the student can see it (`MARK-2`).
    GradingQueueItem:
      type: object
      required: [submissionId, assessmentId, assessmentTitle, assessmentType, maxScore,
                 studentId, studentName, studentEmail, submittedAt, lastSubmittedAt,
                 fileUrl, answerText, annotatedFileUrl, score, feedback, correctedAt,
                 returnedAt, status, isLate]
      properties:
        submissionId:     { $ref: '#/components/schemas/Id' }
        assessmentId:     { $ref: '#/components/schemas/Id' }
        assessmentTitle:  { type: string }
        assessmentType:   { $ref: '#/components/schemas/AssessmentType' }
        maxScore:         { type: integer }
        studentId:        { $ref: '#/components/schemas/Id' }
        studentName:      { type: string }
        studentEmail:     { type: string }
        submittedAt:      { type: string, format: date-time }
        lastSubmittedAt:  { type: string, format: date-time }
        fileUrl:          { type: [string, 'null'] }
        answerText:       { type: [string, 'null'] }
        annotatedFileUrl: { type: [string, 'null'] }
        score:            { type: [integer, 'null'] }
        feedback:         { type: [string, 'null'] }
        correctedAt:      { type: [string, 'null'], format: date-time, description: When the mark was saved. }
        returnedAt:       { type: [string, 'null'], format: date-time, description: When it was handed back; null while saved-not-returned. }
        status:           { type: string, enum: [awaiting, graded] }
        isLate:           { type: boolean }

    # --- Sessions ----------------------------------------------------------
    Session:
      type: object
      required: [id, groupId, title, scheduledAt, endsAt, mode, state]
      properties:
        id:          { $ref: '#/components/schemas/Id' }
        groupId:     { $ref: '#/components/schemas/Id' }
        groupName:   { type: string }
        title:       { type: string }
        scheduledAt: { type: string, format: date-time }
        endsAt:      { type: string, format: date-time }
        mode:        { $ref: '#/components/schemas/SessionMode' }
        location:
          type: [string, 'null']
          description: >
            A room name when mode is on_ground; a meeting link when online.
            The link is REDACTED for students until 30 minutes before the start.
        assistantId: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        isVisible:   { type: boolean }
        state:       { type: string, enum: [planned, published] }

    SessionWrite:
      type: object
      required: [title, scheduledAt, endsAt, mode]
      properties:
        title:        { type: string, minLength: 1, maxLength: 200 }
        scheduledAt:  { type: string, format: date-time }
        endsAt:       { type: string, format: date-time }
        mode:         { $ref: '#/components/schemas/SessionMode' }
        location:     { type: [string, 'null'], maxLength: 2048 }
        assistantId:  { type: [string, 'null'] }
        description:  { type: [string, 'null'], maxLength: 2000 }
        privateNotes: { type: [string, 'null'], maxLength: 2000 }
        isVisible:    { type: boolean, default: true }
        state:        { type: string, enum: [planned, published], default: published }
        notifyOnChange: { type: boolean, default: true }

    AttendanceEntry:
      type: object
      required: [studentId, status]
      properties:
        studentId: { $ref: '#/components/schemas/Id' }
        status:    { $ref: '#/components/schemas/AttendanceStatus' }

    # --- Reports -----------------------------------------------------------
    WeeklyReportSummary:
      type: object
      required: [id, studentId, studentName, groupId, weekNumber, status, sent]
      properties:
        id:          { $ref: '#/components/schemas/Id' }
        studentId:   { $ref: '#/components/schemas/Id' }
        studentName: { type: string }
        groupId:     { $ref: '#/components/schemas/Id' }
        groupName:   { type: string }
        weekNumber:  { type: integer }
        periodStart: { type: string, format: date }
        periodEnd:   { type: string, format: date }
        status:      { $ref: '#/components/schemas/ReportStatus' }
        assistantName: { type: [string, 'null'] }
        reviewedAt:  { type: [string, 'null'], format: date-time }
        sent:        { type: boolean }

    WeeklyReportDetail:
      allOf:
        - $ref: '#/components/schemas/WeeklyReportSummary'
        - type: object
          properties:
            # Every figure below is COMPUTED over the period. None is stored as
            # a mark; none may be averaged with another (non-negotiable 02).
            attendancePercent:  { type: [number, 'null'] }
            homeworkPercent:    { type: [number, 'null'] }
            quizPercent:        { type: [number, 'null'] }
            performancePercent: { type: [number, 'null'] }
            progressPercent:    { type: [number, 'null'] }
            items:
              type: array
              items:
                type: object
                properties:
                  title:    { type: string }
                  type:     { $ref: '#/components/schemas/AssessmentType' }
                  handedInAt: { type: [string, 'null'], format: date-time }
                  score:    { type: [number, 'null'] }
                  maxScore: { type: [number, 'null'] }
            trend:
              type: array
              description: Five-week performance trend, marks out of 100.
              items:
                type: object
                properties:
                  label: { type: string }
                  value: { type: number }
            teacherNote:   { type: [string, 'null'] }
            assistantNote: { type: [string, 'null'] }

# =============================================================================
paths:

  # --- Registration approval ---------------------------------------------
  /admin/students:
    get:
      tags: [students-admin]
      summary: Student directory, including the waiting queue
      x-roles: [teacher, admin]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
        - { name: groupId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StudentDirectoryEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [students-admin]
      summary: Create a student directly, skipping the waiting list
      description: The student is created active and emailed a sign-in link.
      x-roles: [teacher, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/students/{studentId}:
    parameters:
      - { name: studentId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      tags: [students-admin]
      x-roles: [teacher, admin, assistant]
      description: Assistants may read a student only within their group scope.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [students-admin]
      x-roles: [teacher, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentWrite' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/students/{studentId}/accept:
    post:
      tags: [students-admin]
      summary: Accept a pending registration
      description: >
        Activates the account, enrols it on the group's course and places it in
        the group, in one transaction. Audited as `student.accepted`.
      x-roles: [teacher, admin]
      parameters:
        - { name: studentId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId]
              properties:
                groupId: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              # The directory row, as it now is - not `StudentDetail`, which
              # carries fields with no source until the reports unit.
              schema: { $ref: '#/components/schemas/StudentDirectoryEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          # An unknown student, a staff id, and an unknown group all answer
          # with the same 404. A staff id is not a registration, and saying so
          # would confirm which ids name staff.
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-audit: student.accepted

  /admin/students/{studentId}/reject:
    post:
      tags: [students-admin]
      summary: Reject a pending registration
      description: >
        Refused for assistants — one of the four withheld verbs. The account is
        marked rejected, never hard-deleted.
      x-roles: [teacher, admin]
      parameters:
        - { name: studentId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, enum: [true] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-audit: student.rejected

  /admin/students/{studentId}/enrollments/{courseId}:
    delete:
      tags: [students-admin]
      summary: Unenrol a student from a course
      description: A withheld verb — teacher and admin only.
      x-roles: [teacher, admin]
      parameters:
        - { name: studentId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
        - { name: courseId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '204': { description: Unenrolled }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-audit: student.unenrolled

  # --- Assistants ---------------------------------------------------------
  /admin/assistants:
    get:
      tags: [assistants-admin]
      x-roles: [teacher, admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Assistant' } }
    post:
      tags: [assistants-admin]
      summary: Invite an assistant
      x-roles: [teacher, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantWrite' }
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assistant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-audit: assistant.invited

  /admin/assistants/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    patch:
      tags: [assistants-admin]
      summary: Change role, scope or assigned groups
      x-roles: [teacher, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantWrite' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assistant' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-audit: assistant.scope_changed
    delete:
      tags: [assistants-admin]
      x-roles: [teacher, admin]
      responses:
        '204': { description: Removed }
      x-audit: assistant.removed

  /admin/assistants/{userId}/resend:
    post:
      tags: [assistants-admin]
      x-roles: [teacher, admin]
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200': { description: Invitation resent }
        '409': { $ref: '#/components/responses/Conflict' }

  # `POST /courses/{id}/enroll` is RETIRED (`DOM-4`, `PRODUCT_SPEC.md:41-49`)
  # and was never written into this file. A student no longer enrols
  # themselves; staff accepting their registration does it, at
  # `POST /admin/students/{studentId}/accept`. The path answers 404.
  /auth/register:
    post:
      tags: [auth]
      summary: Register, into the waiting queue
      description: >
        Creates a `student` account with `status = waiting` and its profile
        row. **Returns no credential** (ruling R-6, 2026-09-20): only `active`
        may authenticate, so a token here would authenticate an account the
        same response records as unable to. The account cannot sign in until
        staff accept it.
        A 409 on a taken email is an account-existence oracle that signup
        genuinely needs to report; rate limiting is what stops it being
        enumerable in bulk.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:    { type: string, format: email }
                password: { type: string, minLength: 8 }
                name:     { type: string, minLength: 1 }
      responses:
        '201':
          description: Registered, and waiting for a decision
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [waiting] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: Rate limited }

  /auth/invitations/{token}/accept:
    post:
      tags: [auth]
      summary: Accept an invitation and set a password
      security: []
      x-public: true
      x-rate-limit: AUTH_ATTEMPT_LIMIT
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: Must contain a letter and a digit, as elsewhere.
      responses:
        '200': { description: Account activated; returns a session }
        '401':
          description: >
            Token unknown, already used, or expired — one message for all three,
            matching the password-reset flow's anti-enumeration behaviour.
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # --- Groups -------------------------------------------------------------
  #
  # `POST /admin/groups/{groupId}/courses` and
  # `DELETE /admin/groups/{groupId}/courses/{courseId}` were RETIRED by `DOM-1`
  # (2026-09-20). A group's course is a field on the group, so adding and
  # removing one is the PATCH below. Both paths now answer 404.
  /admin/groups:
    get:
      tags: [groups]
      summary: The group console list
      x-roles: [teacher, admin]
      parameters:
        - { name: limit,  in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Group' }
    post:
      tags: [groups]
      summary: Create a group
      description: >
        Enrols no students. `Enrollment` remains the access gate, so naming a
        course on a group grants nobody anything.
      x-roles: [teacher, admin]
      x-audit: group.created
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '404':
          description: >
            No such course, or a course this staff member may not reach — one
            message for both, so an assistant cannot enumerate the catalog.

  # --- The staff group surface, scoped by D-10 ---------------------------
  # These three exist in the implementation and were absent here. `AUTH-2`
  # changed their authorization, which is the point at which an undocumented
  # route stops being a nuisance and starts being a contract nobody can check.
  #
  # An assistant whose scope is `assigned_groups` reaches ONLY the groups named
  # by `assistant_group_assignments`. Out of scope answers **404 with a message
  # byte-identical to a genuine miss** — reads and the placement write alike, so
  # an assistant cannot enumerate cohorts one id at a time. `groups.assistantId`
  # is a DISPLAY field and is never read for this decision.
  /staff/groups/{groupId}:
    parameters:
      - { name: groupId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      tags: [groups]
      summary: One group, with its member count
      x-roles: [assistant, teacher, admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '404':
          description: >
            No such group, or a group this assistant may not reach — one
            message for both (D-10).

  /staff/groups/{groupId}/report:
    get:
      tags: [groups]
      summary: Group report — stats plus a per-student table (`GROUP-4`)
      description: >
        Scored against what was actually targeted at this group, not every
        assessment on the course. No PDF route: the frontend renders this
        data and the browser's own print-to-PDF produces the file — there is
        no server-side PDF library in this stack, and no existing PDF to
        overlay the way marking's rendered-overlay pattern (`D-2`) assumes.
      x-roles: [assistant, teacher, admin]
      parameters:
        - { name: groupId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupReport' }
        '404':
          description: >
            No such group, or a group this assistant may not reach — one
            message for both (D-10).

  /staff/groups/{groupId}/members:
    parameters:
      - { name: groupId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      tags: [groups]
      summary: The staff roster — name and email per member
      description: >
        Narrower than it looks: the student-facing classmate list carries no
        email, and the two are built by different methods so widening this one
        cannot widen that one. This read is the leak D-10 closed.
      x-roles: [assistant, teacher, admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [studentId, name, email, assignedBy, assignedAt]
                  properties:
                    studentId:  { $ref: '#/components/schemas/Id' }
                    name:       { type: string }
                    email:      { type: string, format: email }
                    assignedBy: { $ref: '#/components/schemas/Id' }
                    assignedAt: { type: string, format: date-time }
        '404':
          description: >
            No such group, or a group this assistant may not reach — one
            message for both (D-10).
    post:
      tags: [groups]
      summary: Place a student in this group
      description: >
        Idempotent: placing someone already in the group answers 201 rather than
        409, because two clicks on Add describe one true state. Placement grants
        no course access — `Enrollment` remains the gate.
      x-roles: [assistant, teacher, admin]
      x-audit: group.student_assigned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId]
              properties:
                studentId: { $ref: '#/components/schemas/Id' }
      responses:
        '201':
          description: Placed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: >
            No such group or student, or a group this assistant may not reach —
            one message for the group cases (D-10).

  /admin/groups/{groupId}:
    parameters:
      - { name: groupId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      tags: [groups]
      summary: One group, with its member count
      x-roles: [teacher, admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [groups]
      summary: Edit a group — name, course, assistant, meets, room
      description: >
        Replaces the rename-only PATCH and the two retired
        `/groups/{groupId}/courses` routes. Changing the course of a group that
        has members is refused with 409: every member would be left enrolled on
        the old course while being targeted by work set for the new one.
      x-roles: [teacher, admin]
      x-audit: group.updated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The group has members and the course would change.
    delete:
      tags: [groups]
      x-roles: [teacher, admin]
      description: >
        Refused while the group has members or sessions. **Target only — not
        implemented.** There is deliberately no delete on `GroupRepository`: a
        group carries placement history, and §9's convention is soft-delete
        where history matters. Removing one has not been asked for.
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/groups/{groupId}/members/bulk:
    post:
      tags: [groups]
      summary: Move several students into this group at once
      description: >
        Backs the roster's "Move N to group". The write underneath is per
        student and audited per student; this endpoint exists so the UI is not
        forced into N requests.
      x-roles: [teacher, admin]
      parameters:
        - { name: groupId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentIds]
              properties:
                studentIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  moved: { type: integer }
      x-audit: group.student_assigned

  /staff/groups/{groupId}/members/{studentId}:
    delete:
      tags: [groups]
      summary: Remove a student from a group
      description: >
        MOVED to teacher/admin by the 2026-09-19 decision. Assistants may add to
        a group but not remove from one.
      x-roles: [teacher, admin]
      parameters:
        - { name: groupId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
        - { name: studentId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
      x-audit: group.student_removed

  # --- Task drafts --------------------------------------------------------
  /staff/task-drafts:
    get:
      tags: [tasks]
      summary: The draft library, scoped to the courses the caller reaches
      description: >
        Grain: a draft carries no group, so it is visible when the caller
        reaches its course through a held group (`AUTHORIZATION_MODEL.md` §4).
        Both filters NARROW - a `courseId` the caller cannot reach answers
        `200 []` exactly as an unknown one does. A never-configured assistant
        gets `[]`. Ordered most recently edited first.
      x-roles: [assistant, teacher, admin]
      parameters:
        - { name: courseId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/AssessmentType' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TaskDraft' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [tasks]
      x-roles: [assistant, teacher, admin]
      description: >
        `courseId` goes through `StaffScopeService.assertAssigned`: an
        unreachable course and a nonexistent one are the same 404
        (`Course not found or not assigned to you`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskDraftWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-audit: task_draft.created

  /staff/task-drafts/{draftId}:
    parameters:
      - { name: draftId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    patch:
      tags: [tasks]
      x-roles: [assistant, teacher, admin]
      description: >
        Editing a draft never changes a task already created from it — the
        content is copied at authoring time, not referenced. Any staff member
        in scope may edit any draft in scope (no own-only rule). A draft on a
        course the caller cannot reach and a nonexistent draft answer the same
        404 body (`Task draft not found`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskDraftUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-audit: task_draft.updated
    delete:
      tags: [tasks]
      x-roles: [assistant, teacher, admin]
      description: >
        Tasks authored from the draft keep their content; their `draftId`
        becomes null. Same 404 rule as PATCH.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-audit: task_draft.deleted

  # --- Authoring ------------------------------------------------------------
  # Added in unit 6 (they changed, and had no entry). All three `{assessmentId}`
  # routes answer a task on an unreachable course with a 404 body IDENTICAL to
  # a nonexistent id (`Assessment not found`) - before unit 6 the first said
  # `Course not found or not assigned to you`, an existence oracle.
  /staff/courses/{courseId}/assessments:
    parameters:
      - { name: courseId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      tags: [tasks]
      summary: Every task on one course, with its full audience
      description: >
        Course-grained (`AUTH-6` remainder): one held cohort reaches every task on
        the course. The group-grain list is `GET /staff/tasks`.
      x-roles: [assistant, teacher, admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuthoredAssessment' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [tasks]
      x-roles: [assistant, teacher, admin]
      description: >
        A `draftId` that is missing, on another course, or unreachable is one
        identical 404 (`Task draft not found`); authoring from a draft adds one to
        its `usedCount` in the same transaction. `D-33`: a target group the caller
        does not hold is a 404 with the same message a group not on the course
        gets (`Group <id> is not enrolled in this course`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssessmentWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthoredAssessment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-audit: assessment.created

  /staff/assessments/{assessmentId}:
    parameters:
      - { name: assessmentId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    patch:
      tags: [tasks]
      x-roles: [assistant, teacher, admin]
      description: >
        403 when an assistant sets or clears `markerId` (`D-32`) - the task is on
        their screen, so the anti-enumeration 404 does not apply.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssessmentPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthoredAssessment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`visibility: hidden` on a task that has any submission (`D-28`) or any synced external result (`D-36`).'
      x-audit: assessment.updated
    delete:
      tags: [tasks]
      x-roles: [assistant, teacher, admin]
      description: >
        Refused with 409 once anything has been submitted (`TASK-F3`, unit 7 - it
        was a 400 until then), and with 409 once any external result has synced
        (`D-36`) - deleting would cascade students' work away. Both are state
        conflicts; the messages differ.
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Conflict' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-audit: assessment.deleted

  /staff/assessments/{assessmentId}/targets:
    parameters:
      - { name: assessmentId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    post:
      tags: [tasks]
      summary: Replace the whole audience (a set, not a diff)
      description: >
        `D-33`. A scoped assistant re-aiming a task whose CURRENT audience includes
        a group they cannot reach is a 403 - refused rather than silently dropping
        groups they cannot see (the task is on their screen). Adding a group they
        do not hold is a 404 whose message is byte-identical to
        `Group <id> is not enrolled in this course` for that id. The teacher, an
        admin and an `all_groups` assistant are unaffected.
      x-roles: [assistant, teacher, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                targets:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { $ref: '#/components/schemas/AssessmentTargetInput' }
      responses:
        '201':
          description: The task with its new audience
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthoredAssessment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-audit: assessment.targeted

  /staff/courses/{courseId}/groups:
    get:
      tags: [groups]
      summary: The groups studying a course that the CALLER reaches
      description: >
        Narrowed to held groups by `D-33` (unit 6), so the task-authoring picker
        offers only groups the targeting write accepts. An unreachable course is
        still the course's 404. `memberCount` is a per-group fact.
      x-roles: [assistant, teacher, admin]
      parameters:
        - { name: courseId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Group' } }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- The student's task routes (only what unit 6 changed) ------------------
  /courses/{courseId}/assessments:
    get:
      tags: [tasks]
      summary: The student's task list for one course
      description: >
        A `hidden` task (`D-28`) is absent. A `published` task with a future window
        is present as `locked`, with its `availableFrom` - that is what "scheduled"
        means to a student.
      x-roles: [student]
      parameters:
        - { name: courseId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }

  /assessments/{assessmentId}:
    get:
      tags: [tasks]
      summary: One task as the student sees it
      description: >
        Carries `attachments` - ONLY those whose `audience` is `students`
        (`D-29`), each without the `audience` field. A `hidden` task (`D-28`) is a
        404 whose body is identical to a nonexistent id. `canSubmit` is false once
        a one-shot task (`allowResubmission: false`) has a submission.
        Unit 7 (`MARK-2`): `submission.returnedAt` is new, and `submission.score`,
        `submission.feedback`, `submission.annotatedFileUrl`, the item's `score`
        and the `corrected` status are all null / withheld until the work is
        returned. A saved-not-returned paper reads `submitted` with `canSubmit:
        false` (the existing freeze) and a non-null `correctedAt`.
        `submission.annotations` (`StudentAnnotation[]`, `MARK-5`) is empty until
        the work is returned, and never carries who drew a mark. It is only ever
        the caller's own submission - resolved from the token, never from an id.
      x-roles: [student]
      parameters:
        - { name: assessmentId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }

  /staff/uploads:
    post:
      tags: [uploads]
      summary: Upload one file to the configured storage driver
      description: >
        The whitelist gained `audio/mpeg` (.mp3) and `audio/mp4` (.m4a) for task
        attachments (`D-29`). The response `kind` is `image | video | audio | file`
        - the upload's own vocabulary, no longer the blog's; the blog refuses
        `audio`. Still no SVG, HTML or anything executable. 503 when
        `STORAGE_DRIVER=none`.
      x-roles: [assistant, teacher, admin]
      responses:
        '201': { description: Stored }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { description: Uploads are not configured on this server }

  /assessments/{assessmentId}/submissions:
    parameters:
      - { name: assessmentId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    post:
      tags: [tasks]
      summary: Submit, or resubmit while the window is open
      description: >
        A second submission to a task with `allowResubmission: false` is a 409
        (unit 6). With `true`, resubmission runs until the window ends, as before.
        A `hidden` task 404s with a body identical to a nonexistent id (`D-28`).
      x-roles: [student]
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /staff/tasks:
    get:
      tags: [tasks]
      summary: Every task in scope, across courses - group-grain from birth
      description: >
        Backs the console's Tasks list (`TASK-6`). A task is listed only through a
        target the caller reaches (`StaffScopeService.reachableGroupIds`), and each
        row's `targets` are narrowed to those groups IN THE QUERY - an assistant
        never receives an unheld group's id or name. Every filter narrows and none
        addresses a resource: an unheld or unknown `groupId` and an unreachable
        `courseId` all answer `200 []`. `search` is a case-insensitive literal
        title substring (`%` and `_` are not wildcards). Ordered `dueAt` desc, id.
        Not paged (two courses, ~20 tasks each). No per-row submission counts
        (`D-30`).
      x-roles: [assistant, teacher, admin]
      parameters:
        - { name: courseId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: groupId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - name: status
          in: query
          description: >
            `D-30`/`D-34`/`D-35`. Derived on the server, never stored. `open` =
            now <= the LATEST of the targeted groups' own due dates (override or
            the task's); after that, `marking` = any ungraded submission, `marked`
            = every submission graded, `closed` = no submission at all (link and
            Google Form work included). Judged over the task's WHOLE audience and
            every submission, so identical for every viewer. Never null.
          schema: { $ref: '#/components/schemas/StaffTaskStatus' }
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StaffTask' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # --- Marking ------------------------------------------------------------
  /staff/assessments/{assessmentId}/submissions:
    get:
      tags: [marking]
      summary: Submissions for one task, including students who have not submitted
      description: >
        `MARK-3` (unit 7). The "Not submitted" row is the absence of a submission
        computed against the targeted groups' membership — it is not a stored
        state. Group grain: only the caller's reachable targeted groups appear,
        restricted in the reads; a task the caller reaches through no target is a
        404 byte-identical to a missing id (`Assessment not found`). A student in
        two reachable targeted groups is one row. 409 for `link`/`google_form`
        work (assumption A-6): nothing is handed in here. Also the marking view's
        read (A-14) - there is no one-submission GET.
      x-roles: [assistant, teacher, admin]
      parameters:
        - { name: assessmentId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskSubmissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /staff/submissions/{submissionId}/annotations:
    description: >
      `MARK-1` (unit 7). Group grain, like `/grade` and `/return`: an out-of-scope
      paper is a 404 byte-identical to a missing submission, answered before any
      400/403. Only a platform-stored image or PDF the submission carries NOW can
      be marked up (`D-41`); a pasted link is graded with a mark and feedback.
      Marking up a returned paper is allowed and audited (`D-42` (b)).
    parameters:
      - { name: submissionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      tags: [marking]
      x-roles: [assistant, teacher, admin]
      responses:
        '200':
          description: OK, ordered by (page, createdAt, id)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Annotation' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [marking]
      summary: Draw one mark (persisted as drawn)
      description: >
        400 for a file not on this submission, a file the platform does not
        store, an incoherent mark (a stroke without a path, a pin with one, a
        blank comment) or a paper already carrying 500 marks (A-11).
      x-roles: [assistant, teacher, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnotationWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Annotation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-audit: submission.annotated

  /staff/submissions/{submissionId}/annotations/{annotationId}:
    description: >
      Only the mark's author may change or erase it (`D-42` (a)) - a 403, not a
      404, because the mark is on the caller's screen; the teacher is not
      exempt. An `annotationId` that belongs to another paper is a 404 whose
      body is identical to a missing one (`Annotation not found`).
    parameters:
      - { name: submissionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      - { name: annotationId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    patch:
      tags: [marking]
      x-roles: [assistant, teacher, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnotationPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Annotation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-audit: submission.annotated
    delete:
      tags: [marking]
      summary: The eraser - a hard delete of one's own mark
      x-roles: [assistant, teacher, admin]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-audit: submission.annotated

  /staff/submissions/{submissionId}/grade:
    post:
      tags: [marking]
      summary: Save a mark (does NOT return it)
      description: >
        `[MODIFY]` (unit 7). Saves the score and feedback and stamps `correctedAt`;
        the student sees none of it until `/return` (`MARK-2`). A re-grade after
        return is allowed and visible immediately (assumption A-4); `returnedAt`
        is never touched here. Group grain (`D-44`): the caller must reach a group
        that the task was set for AND the student sits in - otherwise a 404 whose
        body is byte-identical to a missing submission (`Submission not found`).
        The first saved mark on a task with no marker names the caller as its
        marker when they qualify (`D-43`), audited as `assessment.updated`.
      x-roles: [assistant, teacher, admin]
      parameters:
        - { name: submissionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score:            { type: integer, minimum: 0, description: 'At most the task''s maxScore (400 otherwise).' }
                feedback:         { type: string, maxLength: 4000 }
                annotatedFileUrl: { type: string, format: uri, maxLength: 2048 }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GradingQueueItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-audit: submission.graded

  /staff/submissions/{submissionId}/return:
    post:
      tags: [marking]
      summary: Return the marked paper to the student
      description: >
        Distinct from saving a mark (`MARK-2`). Returning is what makes the score,
        feedback, annotated copy, annotations and `corrected` status visible to
        the student. The original file is never replaced. 409 when the paper has
        no saved mark. Returning an already-returned paper is a 200 no-op: the
        first `returnedAt` is kept and no second audit entry is written. No
        request body - `includeInReport` is deferred to the weekly-reports unit
        (assumption A-5). Group grain, with the same byte-identical 404 as `/grade`.
      x-roles: [assistant, teacher, admin]
      parameters:
        - { name: submissionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: Returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GradingQueueItem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-audit: submission.returned

  # --- Mark book ----------------------------------------------------------
  /staff/groups/{groupId}/markbook:
    get:
      tags: [markbook]
      summary: Student × task grid for one group
      description: A missing mark is null and renders as an em-dash, never as zero.
      x-roles: [assistant, teacher, admin]
      parameters:
        - { name: groupId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- Sessions and attendance -------------------------------------------
  /staff/sessions:
    get:
      tags: [sessions]
      summary: Sessions in scope within a date range
      x-roles: [assistant, teacher, admin]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: groupId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: state, in: query, schema: { type: string, enum: [planned, published] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Session' } }

  /staff/groups/{groupId}/sessions:
    post:
      tags: [sessions]
      summary: Create a session for a group
      x-roles: [teacher, admin]
      parameters:
        - { name: groupId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
      x-audit: session.published

  /staff/sessions/{sessionId}:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    patch:
      tags: [sessions]
      x-roles: [teacher, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionWrite' }
      responses:
        '200': { description: OK }
      x-audit: live_session.updated
    delete:
      tags: [sessions]
      x-roles: [teacher, admin]
      responses:
        '204': { description: Cancelled }
      x-audit: live_session.cancelled

  /staff/sessions/{sessionId}/publish:
    post:
      tags: [sessions]
      summary: Promote a planned session to published
      x-roles: [teacher, admin]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200': { description: Published }
        '409': { $ref: '#/components/responses/Conflict' }
      x-audit: session.published

  /staff/sessions/{sessionId}/attendance:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      tags: [sessions]
      summary: The attendance sheet for a session
      x-roles: [assistant, teacher, admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AttendanceEntry' } }
    put:
      tags: [sessions]
      summary: Mark attendance for the whole session at once
      description: >
        Idempotent whole-sheet replace. Three states, not a boolean — the
        boolean could not express "late", which the design requires.
      x-roles: [assistant, teacher, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  maxItems: 200
                  items: { $ref: '#/components/schemas/AttendanceEntry' }
      responses:
        '200': { description: Recorded }
        '404': { $ref: '#/components/responses/NotFound' }
      x-audit: attendance.marked

  # --- Weekly reports -----------------------------------------------------
  /staff/reports:
    get:
      tags: [reports]
      summary: Weekly reports in scope
      x-roles: [assistant, teacher, admin]
      parameters:
        - { name: groupId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ReportStatus' } }
        - { name: week, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/WeeklyReportSummary' } }

  /staff/reports/{reportId}:
    parameters:
      - { name: reportId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      tags: [reports]
      x-roles: [assistant, teacher, admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklyReportDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [reports]
      summary: Save the assistant note
      description: >
        Moves the report from `new` to `under_review`. The note reaches the
        parent verbatim and is the only human-written part of the report.
      x-roles: [assistant, teacher, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assistantNote: { type: string, maxLength: 4000 }
                teacherNote:   { type: string, maxLength: 4000 }
      responses:
        '200': { description: Saved }
        '409':
          description: The report has already been sent and is immutable.

  /staff/reports/{reportId}/review:
    post:
      tags: [reports]
      summary: Mark a report reviewed
      description: Requires a non-empty assistant note.
      x-roles: [assistant, teacher, admin]
      parameters:
        - { name: reportId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200': { description: Reviewed }
        '409': { $ref: '#/components/responses/Conflict' }
      x-audit: report.reviewed

  /staff/reports/{reportId}/send:
    post:
      tags: [reports]
      summary: Send the report to the parent
      description: >
        Teacher and admin only — an assistant may never send. Requires status
        `reviewed` and a `parentEmail` on the student. Irreversible: there is no
        unsend, and deliberately no send-to-all-groups action anywhere in the API.
      x-roles: [teacher, admin]
      parameters:
        - { name: reportId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200': { description: Sent }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Not reviewed, already sent, or the student has no parent email.
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
      x-audit: report.sent

  /admin/reports/generate:
    post:
      tags: [reports]
      summary: Generate or regenerate a week's reports
      x-roles: [teacher, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weekNumber]
              properties:
                weekNumber: { type: integer }
                courseId:   { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated: { type: integer }
                  skipped:   { type: integer, description: Already sent; never overwritten. }

  # --- Announcements ------------------------------------------------------
  /admin/announcements/reach:
    get:
      tags: [announcements]
      summary: How many students an audience currently reaches
      description: >
        Resolved live. The audience is never stored as a frozen recipient list —
        a stored list silently misses anyone who joins after drafting.
      x-roles: [assistant, teacher, admin]
      parameters:
        - { name: audience, in: query, required: true,
            schema: { type: string, pattern: '^(all_students|all_tas|course:[A-Za-z0-9_-]+|group:[A-Za-z0-9_-]+)$' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { reach: { type: integer } }

  /admin/announcements/{announcementId}/publish:
    post:
      tags: [announcements]
      summary: Publish a draft announcement
      description: >
        Appears in the LMS immediately and emails every recipient exactly once.
        The email cannot be recalled; editing afterwards does not re-send.
      x-roles: [teacher, admin]
      parameters:
        - { name: announcementId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200': { description: Published }
        '409': { $ref: '#/components/responses/Conflict' }
      x-audit: announcement.posted

  # --- Settings -----------------------------------------------------------
  /admin/courses:
    post:
      tags: [settings]
      summary: Create a course
      description: >
        Created as a DRAFT unless `isPublished` says otherwise, with an empty
        outline - modules and lessons are authored afterwards. Unscoped:
        creating a course is not a question an assistant is asked.
      x-roles: [teacher, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-audit: course.created

  /admin/courses/{courseId}:
    patch:
      tags: [settings]
      summary: Edit a course
      description: >
        Partial. The outline is not writable here. 409 on a slug another course
        already holds.
      x-roles: [teacher, admin]
      parameters:
        - { name: courseId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoursePatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-audit: course.updated

  /me/profile:
    get:
      tags: [settings]
      summary: The signed-in staff member's own profile
      description: >
        `/students/me/profile` is student-only; staff have had no equivalent.
      x-roles: [assistant, teacher, admin]
      responses:
        '200': { description: OK }
    patch:
      tags: [settings]
      x-roles: [assistant, teacher, admin]
      responses:
        '200': { description: OK }

  /me/notification-preferences:
    get:
      tags: [settings]
      x-roles: [assistant, teacher, admin]
      responses:
        '200': { description: OK }
    put:
      tags: [settings]
      x-roles: [assistant, teacher, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                submissions:   { type: boolean }
                registrations: { type: boolean }
                unmatched:     { type: boolean }
                weeklySummary: { type: boolean }
      responses:
        '200': { description: OK }

  # --- Student surface ----------------------------------------------------
  /students/me/timetable:
    get:
      tags: [student]
      summary: The student's own week
      description: >
        A meeting link is omitted from the payload until 30 minutes before the
        session starts — enforced server-side, not by hiding a button.
      x-roles: [student]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Session' } }

  /students/me/attendance:
    get:
      tags: [student]
      x-roles: [student]
      responses:
        '200': { description: OK }

  /students/me/reports:
    get:
      tags: [student]
      summary: The student's own weekly reports, newest first
      description: Only reports with status `sent` are visible to the student.
      x-roles: [student]
      parameters:
        - { name: period, in: query, schema: { type: string } }
      responses:
        '200': { description: OK }

  /students/me/avatar:
    post:
      tags: [student]
      summary: Upload a profile photo
      description: >
        The only student-reachable upload. Images only, tighter size cap than
        the staff endpoint. Filename is server-minted; the client's is discarded.
      x-roles: [student]
      x-rate-limit: UPLOAD_LIMIT
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: Uploaded }
        '413': { description: Too large }
        '415': { description: Unsupported media type }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
