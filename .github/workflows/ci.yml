name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint:frontend --if-present

      - name: Lint backend
        run: npm run lint:backend --if-present

      - name: Build frontend
        run: npm run build:frontend --if-present

      - name: Build backend
        run: npm run build:backend --if-present

      - name: Run tests
        run: npm run test --if-present

  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker images
        run: |
          docker build -f Dockerfile.frontend -t tahirelshazli-frontend:latest .
          docker build -f Dockerfile.backend -t tahirelshazli-backend:latest .
