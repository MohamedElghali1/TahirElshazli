# Local full-stack development environment.
#
# `docker compose up -d` gives you Postgres + the API on the postgres driver +
# the web app. If you only want to click through the UI, `npm run dev` from the
# repo root is faster and needs no database at all - it runs the API on the
# in-memory fixtures. See README "Quick start".
#
# The `version:` key is deliberately absent: Compose v2 ignores it and warns
# that it is obsolete.

services:
  postgres:
    image: postgres:15-alpine
    container_name: tahirelshazli-db
    environment:
      POSTGRES_DB: tahirelshazli
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d tahirelshazli"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      # Context is the repo root and the Dockerfile lives there too: this is an
      # npm workspaces monorepo with one lockfile, and `npm ci` from inside
      # backend/ has no lockfile to install from.
      context: .
      dockerfile: Dockerfile.backend
    container_name: tahirelshazli-api
    environment:
      NODE_ENV: development
      # env.ts already defaults to 3001, but the port is pinned here so the
      # value the container binds and the port mapping below can never drift
      # apart silently.
      PORT: 3001
      # Compose ships a Postgres service, so the container uses it rather than
      # the in-memory stubs. Switch to `memory` to run the API without the db.
      PERSISTENCE_DRIVER: postgres
      DATABASE_URL: postgresql://dev:devpassword@postgres:5432/tahirelshazli
      # Single container, so boot-time migration is safe here. With more than
      # one replica this becomes a CI/CD step (`npm run db:migrate`) instead,
      # or every instance races to apply the same DDL.
      DB_AUTO_MIGRATE: "1"
      # Fixtures on every boot, so the stack comes up with something to sign in
      # as. Without it the eight migrations land on an empty database and there
      # is no account at all - a stack that reports healthy and cannot be used.
      # Every seed file is idempotent, so a restart re-applies nothing.
      #
      # env.ts refuses this outright when NODE_ENV=production: the fixtures
      # carry known logins with a published password hash.
      DB_AUTO_SEED: "1"
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_EXPIRY: 24h
      CORS_ORIGIN: http://localhost:3000
      # No proxy in front of the container in local compose. A non-zero value
      # here would let a client set X-Forwarded-For and get a fresh rate-limit
      # bucket per request.
      TRUSTED_PROXY_HOPS: 0
      # Blog media uploads (CLAUDE.md 5.19). `local` writes to disk and is the
      # non-production default anyway, but it is stated here because the volume
      # below only makes sense alongside it - and because `none` is the value a
      # real deploy uses until Cloudflare R2 is provisioned, at which point this
      # becomes `r2` and the volume goes away. env.ts refuses `local` outright
      # when NODE_ENV=production.
      STORAGE_DRIVER: local
      # Absolute on purpose. The driver resolves a relative path against the
      # process working directory, which is /app/backend here - so the default
      # `var/uploads` lands in the same place. Writing it out means the mount
      # target below and the directory the app actually writes to cannot drift
      # apart silently.
      UPLOAD_DIR: /app/backend/var/uploads
    ports:
      - "3001:3001"
    volumes:
      # Uploaded files survive `docker compose up --build`. Without this an
      # image rebuild discards every uploaded image while the blog_post_media
      # rows pointing at them survive in the postgres volume - a gallery of
      # broken images and no error anywhere, which is the exact failure
      # env.ts describes when it refuses this driver in production.
      #
      # It does not make the driver production-safe: a volume is still one
      # host's disk, so a second replica serves 404s for half the files. R2 is
      # the answer there, not a bigger volume.
      - upload_data:/app/backend/var/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # Deliberately no memory/CPU limits here: the right numbers come from
    # measuring this workload, and a guessed limit either does nothing or OOM-
    # kills the API under a load nobody has profiled. They belong in the VPS
    # deployment once there is a profile to size them from.
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Inlined into the client bundle at build time, so it has to be a URL
        # the *browser* can reach - not the compose service name. Reaching the
        # API as http://backend:3001 would only work from inside the network.
        NEXT_PUBLIC_API_URL: http://localhost:3001
    container_name: tahirelshazli-web
    environment:
      # Server-side rendering only, and deliberately not a NEXT_PUBLIC_ value.
      #
      # Two different networks: the browser reaches the API through the
      # published port on the host (NEXT_PUBLIC_API_URL, inlined at build time
      # in `args:` above), while a Server Component rendering *inside this
      # container* has to use the compose service name. Pointing it at
      # localhost:3001 makes it call Next.js itself - /courses/[slug] 500s and
      # /blog renders "that did not load", with both the API and the database
      # perfectly healthy.
      #
      # Unlike the NEXT_PUBLIC_ value this one is read at request time, so it
      # belongs here rather than in `args:`.
      INTERNAL_API_URL: http://backend:3001
    # Nothing else belongs here. This service previously set
    # NEXT_PUBLIC_VIDEO_CDN and NEXT_PUBLIC_STORAGE_URL here, which did nothing:
    # NEXT_PUBLIC_* is inlined into the client bundle at build time, so a value
    # supplied to the *container* is never read. Nothing in frontend/ consumes
    # either one yet. When the Bunny Stream and R2 origins are actually wired up,
    # they belong in `args:` above alongside NEXT_PUBLIC_API_URL - not here,
    # where they would read as live configuration while silently being ignored.
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  upload_data:
